name: Build and Deploy Docs

on:
  push:
    branches:
      - main
      - ci

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build
          pip install -r requirements.txt

      - name: Install Doxybook2
        run: |
          wget -q https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          unzip doxybook2-linux-amd64-v1.5.0.zip
          ls
          sudo mv bin/doxybook2 /usr/local/bin/

      - name: Build Docs via CMake
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target docs

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
