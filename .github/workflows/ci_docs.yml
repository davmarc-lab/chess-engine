name: Build and Deploy Docs

on:
  push:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.event.head_commit.message, 'fix:') || 
      startsWith(github.event.head_commit.message, 'feat:') || 
      startsWith(github.event.head_commit.message, 'docs:')) &&
      !contains(github.event.head_commit.message, '[skip docs]')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Cache Packages - Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: doxygen cmake ninja-build libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev

      - name: Install Python dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Install Doxybook2
        run: |
          wget -q https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          unzip doxybook2-linux-amd64-v1.5.0.zip
          sudo mv bin/doxybook2 /usr/local/bin/

      - name: Build Docs via CMake
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target docs_gh

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --config-file docs/mkdocs.yml
